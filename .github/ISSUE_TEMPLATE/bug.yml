name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Please never paste passwords or personal text. For a **security** problem, do not open an issue: use the private report described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Program version
      description: Right-click the tray icon › About
      placeholder: "1.6.4"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Program you were typing in
      placeholder: "Word, Chrome, WhatsApp, Notepad…"
  - type: input
    id: layouts
    attributes:
      label: Keyboard layouts installed
      placeholder: "Hebrew + English (US), French AZERTY…"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce if you can.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic (optional)
      description: Settings › Diagnostic › Copy. It contains program names and steps, never your text.
      render: text
