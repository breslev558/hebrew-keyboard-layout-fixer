[package]
name = "KeyboardLayoutFixer"
version = "1.8.1"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "KeyboardLayoutFixer"
path = "src/main.rs"

[dependencies]
klf-core = { path = "../klf-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange",
  "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Registry",
  "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_Console", "Win32_Storage_FileSystem",
  "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_Globalization", "Win32_Media_Audio",
  "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_UI_Accessibility", "Win32_UI_Controls_Dialogs",
  "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_System_RemoteDesktop",
] }

[build-dependencies]
embed-resource = "3"
